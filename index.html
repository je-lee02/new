<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 청년 마음건강 자격검정 시험</title>
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--p:#2563eb;--p-h:#1d4ed8;--txt:#0f172a;
  --mut:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 4px 6px -1px rgba(0,0,0,0.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;padding:20px 12px}
.wrap{max-width:680px;margin:0 auto}
header{text-align:center;margin-bottom:24px;background:var(--card);padding:24px 16px;border-radius:var(--radius);box-shadow:var(--shadow)}
h1{font-size:20px;color:var(--p);margin-bottom:8px;font-weight:700}
header p{font-size:14px;color:var(--mut)}
.sec{background:var(--card);border-radius:var(--radius);padding:20px 16px;margin-bottom:20px;box-shadow:var(--shadow)}
.sec-title{font-size:16px;font-weight:700;margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:8px;color:var(--p)}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.req{color:#ef4444}
input[type="text"],input[type="tel"]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px}
input[type="text"]:focus,input[type="tel"]:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.radios{display:flex;gap:12px;flex-wrap:wrap}
.radio-lbl{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.consent-box{background:#f1f5f9;padding:12px;border-radius:6px;font-size:12px;color:var(--mut);max-height:100px;overflow-y:auto;margin-bottom:8px;line-height:1.4}
.q{background:var(--card);border-radius:var(--radius);padding:20px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.q h3{font-size:15px;line-height:1.5;margin-bottom:12px;word-break:keep-all}
.q h3 .no{color:var(--p);font-weight:700}
.q h3 .pts{font-size:12px;color:var(--mut);font-weight:normal;margin-left:4px}
.box{background:#f8fafc;border:1px dashed var(--border);padding:12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.opts{list-style:none}
.opts li{margin-bottom:8px}
.opt{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:13.5px;cursor:pointer;display:flex;align-items:flex-start;gap:8px;line-height:1.4}
.opt:hover{border-color:var(--p);background:#f0f7ff}
.opt[aria-pressed="true"]{border-color:var(--p);background:#eff6ff;color:var(--p);font-weight:600}
.opt .mark{font-weight:bold;color:var(--mut);flex-shrink:0}
.opt[aria-pressed="true"] .mark{color:var(--p)}
.submit-btn{width:100%;background:var(--p);color:#fff;border:none;padding:14px;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.submit-btn:hover{background:var(--p-h)}
.submit-btn:disabled{background:var(--mut);cursor:not-allowed}
#err{color:#ef4444;font-size:13px;text-align:center;margin-top:8px;font-weight:600}
#done{display:none;background:var(--card);border-radius:var(--radius);padding:40px 20px;text-align:center;box-shadow:var(--shadow)}
#done.show{display:block}
#done h2{color:var(--p);margin-bottom:8px}
#done p{color:var(--mut);font-size:14px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>2026년 청년 마음건강 자격검정 시험</h1>
    <p>광명시 청년들의 마음건강에 대한 상식과 이해를 위한 검정시험입니다.</p>
  </header>

  <form id="exam">
    <!-- 개인정보 입력 -->
    <div class="sec">
      <div class="sec-title">응시자 정보</div>
      <div class="field">
        <label for="name">성명 <span class="req">*</span></label>
        <input type="text" id="name" required placeholder="홍길동">
      </div>
      <div class="field">
        <label for="birth">출생연도 <span class="req">*</span></label>
        <input type="text" id="birth" required placeholder="예: 1998">
      </div>
      <div class="field">
        <label>거주 지역 <span class="req">*</span></label>
        <div class="radios">
          <label class="radio-lbl"><input type="radio" name="live" value="광명시" required> 광명시</label>
          <label class="radio-lbl"><input type="radio" name="live" value="타지역"> 타지역</label>
        </div>
      </div>
      <div class="field">
        <label for="phone">전화번호 <span class="req">*</span></label>
        <input type="tel" id="phone" required placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label>개인정보 수집·이용 동의 <span class="req">*</span></label>
        <div class="consent-box">
          수집 목적: 2026 청년 마음건강 자격검정 시험 참여 확인 및 결과 안내<br>
          수집 항목: 성명, 출생연도, 거주지역, 전화번호<br>
          보유 및 이용 기간: 목적 달성 후 지체 없이 파기
        </div>
        <div class="radios">
          <label class="radio-lbl"><input type="radio" name="consent" value="동의" required> 동의함</label>
          <label class="radio-lbl"><input type="radio" name="consent" value="미동의"> 동의하지 않음</label>
        </div>
      </div>
    </div>

    <!-- 문제 영역 -->
    <div id="qs"></div>

    <button type="submit" class="submit-btn" id="submitBtn">답안 제출하기</button>
    <div id="err" role="alert"></div>
  </form>

  <!-- 제출 완료 화면 -->
  <div id="done" tabindex="-1">
    <h2>제출이 완료되었습니다!</h2>
    <p id="doneWho"></p>
    <p style="margin-top:12px;">참여해 주셔서 감사합니다.</p>
  </div>
</div>

<script>
// 구글 앱스 스크립트 웹앱 URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu7emudYl_DhKpzcTE0tydStDtrpUbELxU7XwmQYK4o4JhyWfJ6-wDxT9JnR8Ew2QEXA/exec";

const Q = [
  {n:1, pts:7, ask:"다음 중 ‘정신건강의학과 진료 기록’과 ‘취업’의 관계에 대한 설명으로 <u>옳은</u> 것은?",
   opts:["정신과 진료 기록은 기업 채용 시 의무적으로 제출해야 한다.","본인 동의 없이 회사가 진료 기록을 열람할 수 없다.","정신과 진료를 받으면 취업 시 불이익이 자동으로 따라온다.","공무원 임용 시 진료 이력이 인사처에 자동으로 보고된다.","진료 기록은 누구나 이름만 알면 조회가 가능하다."]},
  {n:2, pts:8, ask:"다음 대화 상황에서 ‘민우’가 ‘나-대화법(I-Message)’의 구성 요소를 모두 갖추어 가장 <u>적절하게</u> 말한 것은?",
   opts:["“너는 지난주에도 그러더니, 갑자기 또 못 온다고 하면 책임감이 너무 없는 거 아니야?”","“급한 일이라니 어쩔 수 없네. 내가 서운한 건 나중에 이야기하고, 이번 건은 내가 처리할게.”","“약속 시간 직전에 갑자기 약속이 취소되면 내가 다른 일정을 조정해야 해서 당황스럽고, 앞으로는 미리 연락을 해줬으면 좋겠어.”","“갑자기 못 온다고 통보를 받으니, 상황이 매우 당황스럽네. 다음에 꼭 제시간에 와야 해.”","“네가 약속을 안 지키니까 내가 스트레스를 너무 많이 받아서 더 이상 같이 일하기가 힘들어.”"]},
  {n:3, pts:7, ask:"단순한 ‘무기력함’과 치료가 필요한 ‘우울증’을 구분하는 가장 중요한 기준으로 <u>옳은</u> 것은?",
   opts:["혼자 있고 싶다는 생각이 가끔 드는가?","오늘 하루 기분이 평소보다 조금 가라앉아 있는가?","증상이 2주 이상 지속되며 일상생활을 정상적으로 하기 힘든가?","식욕이 평소보다 조금 더 좋아졌는가?","슬픈 영화를 보고 눈물을 흘리는가?"]},
  {n:4, pts:7, ask:"정신건강의학과에서 처방받는 ‘항우울제’의 특징에 대한 설명으로 <u>옳은</u> 것은?",
   opts:["다른 약에 비해 중독성이 강하고, 끊기 어렵다.","증상이 조금만 좋아지면 즉시 복용을 중단해도 된다.","약을 먹고 1시간 이내에 즉각적으로 기분이 좋아진다.","장기간 복용하면 뇌의 감정 조절 기능이 영구적으로 상실된다.","효과가 나타나기까지 보통 2~4주 정도의 시간이 걸린다."]},
  {n:5, pts:7, ask:"성인 ADHD(주의력결핍과잉행동장애)에 대한 설명으로 <u>옳은</u> 것은?",
   opts:["어릴 적에 없다가 20대 이후 후천적인 스트레스로 인해 갑자기 생겨나는 질환이다.","만성적인 미루기나 시간 관리의 어려움은 단순히 게으른 성격 탓으로 성인 ADHD와 전혀 관련 없다.","성인 ADHD 치료약은 집중력을 높여주는 영양제로 아무나 복용해도 된다.","적절한 치료를 통해 감정·시간 조절, 업무 수행 등에서 느끼는 어려움을 줄일 수 있다.","의지력이나 태도의 문제이므로 약물 치료보다는 의지로 극복할 수 있다."]},
  {n:6, pts:8, ask:"2026년 광명시 청년 정신건강 실태조사 결과, 청년들이 희망하는 서비스 1위는?",
   opts:["마음건강 콘텐츠","스트레스 해소 프로그램","정신건강 검사 및 해석","인식개선 서포터즈","정신건강의학과 치료비 지원"]},
  {n:7, pts:8, ask:"양극성정동장애(조울증)에 대한 설명으로 올바르지 <u>않은</u> 것을 <u>모두</u> 고른 것은?",
   box:["ㄱ. 조울증은 단순히 기분이 수시로 변하는 일상적인 감정 기복과 동일한 개념이다.","ㄴ. ‘조증’ 상태에서는 잠을 거의 자지 않아도 피곤함을 느끼지 않거나, 과도한 자신감 및 무모한 소비 행동이 나타날 수 있다.","ㄷ. 우울했던 사람이 기분이 좋아지거나 의욕을 되찾으면 무조건 조울증의 ‘조증’ 상태로 변화한 것이다.","ㄹ. 양극성정동장애 Ⅰ형의 특징은 증상이 약한 조증 삽화(경조증)가 나타나는 것이고, Ⅱ형의 특징은 조증 삽화이다."],
   opts:["ㄱ, ㄷ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"]},
  {n:8, pts:8, ask:"2026년 광명시 청년 정신건강 실태조사 결과, 청년들의 스트레스 원인 1위는?",
   opts:["취업 준비 및 미래에 대한 불확실성","주거 불안정 및 집값 문제","연애 및 결혼","학업 및 스펙 쌓기","직장생활"]},
  {n:9, pts:8, ask:"광명시정신건강복지센터 청년 인스타그램(gmmh_youth_info)에서 인스타툰으로 다루지 <u>않은</u> 내용은?",
   opts:["수면 위생","우울 행동활성화","재난 반응","경계성 인격장애","섭식장애"]},
  {n:10, pts:7, ask:"정신과 약물을 먹으면 ‘바보가 되거나 뇌가 망가진다’는 오해에 대한 설명으로 <u>옳은</u> 것은?",
   opts:["적절한 약물 치료는 뇌의 불균형을 잡아 회복을 돕는다.","약물 복용 시 뇌 기능이 영구적으로 마비된다.","모든 정신과 약물은 중독성이 강해 평생 끊을 수 없다.","뇌세포를 영구적으로 위축시켜 지능을 떨어뜨린다.","복용 중 나타나는 졸음은 뇌 기능이 저하된다는 신호이다."]}
];

const qs = document.getElementById("qs");
const picks = {};
const circ = ["①","②","③","④","⑤"];

function el(tag, cls, html){
  const e = document.createElement(tag); 
  if(cls) e.className = cls; 
  if(html != null) e.innerHTML = html; 
  return e;
}

// 문제 생성
Q.forEach(q => {
  const art = el("article", "q"); 
  art.id = "q" + q.n;
  art.appendChild(el("h3", null, `<span class="no">${q.n}.</span> ${q.ask} <span class="pts">[${q.pts}점]</span>`));
  
  if(q.box) {
    const boxEl = el("div", "box", q.box.map(b => `<p>${b}</p>`).join(""));
    art.appendChild(boxEl);
  }

  const ul = el("ul", "opts");
  q.opts.forEach((optText, idx) => {
    const li = el("li");
    const btn = el("button", "opt", `<span class="mark">${circ[idx]}</span><span>${optText}</span>`);
    btn.type = "button";
    btn.setAttribute("aria-pressed", "false");
    
    btn.addEventListener("click", () => {
      ul.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      picks[q.n] = idx + 1;
    });
    
    li.appendChild(btn);
    ul.appendChild(li);
  });
  
  art.appendChild(ul);
  qs.appendChild(art);
});

// 폼 제출
const examForm = document.getElementById("exam");
const submitBtn = document.getElementById("submitBtn");
const errEl = document.getElementById("err");
const doneEl = document.getElementById("done");

examForm.addEventListener("submit", async function(e) {
  e.preventDefault();
  errEl.textContent = "";

  const name = document.getElementById("name").value.trim();
  const birth = document.getElementById("birth").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const liveEl = document.querySelector('input[name="live"]:checked');
  const consentEl = document.querySelector('input[name="consent"]:checked');

  if (!name || !birth || !phone || !liveEl || !consentEl) {
    errEl.textContent = "개인정보 입력 및 동의 항목을 모두 작성해 주세요.";
    return;
  }

  if (consentEl.value !== "동의") {
    errEl.textContent = "개인정보 수집·이용에 동의하셔야 제출할 수 있습니다.";
    return;
  }

  for (let i = 1; i <= Q.length; i++) {
    if (!picks[i]) {
      errEl.textContent = `${i}번 문항의 답을 선택해 주세요.`;
      document.getElementById("q" + i).scrollIntoView({ behavior: "smooth" });
      return;
    }
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "제출 중...";

  const payload = {
    name: name,
    birth: birth,
    live: liveEl.value,
    phone: phone,
    consent: consentEl.value,
    answers: JSON.stringify(picks),
    timestamp: new Date().toLocaleString("ko-KR")
  };

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(payload).toString()
    });

    examForm.style.display = "none";
    doneEl.classList.add("show");
    document.getElementById("doneWho").textContent = `${name}님의 답안이 정상적으로 전송되었습니다.`;
    doneEl.focus();

  } catch (error) {
    console.error("전송 에러:", error);
    errEl.textContent = "제출 중 오류가 발생했습니다. 다시 시도해 주세요.";
    submitBtn.disabled = false;
    submitBtn.textContent = "답안 제출하기";
  }
});
</script>
</body>
</html>
